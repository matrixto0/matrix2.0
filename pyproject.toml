[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix2"
version = "2.0.0"
description = "An experimental mathematical framework for symbolic encoding, decoding, dynamical systems, and reproducible research."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MATRIX2.0 Contributors"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
